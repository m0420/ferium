name: Publish and Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (z.B. v4.7.2-unofficial)'
        required: true
        default: 'v4.7.2-unofficial'
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gh-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          workflow_conclusion: success
          name: binaries-.*
          name_is_regexp: true
          path: ./out

      - name: Create sha256sum for Windows
        run: |
          find ./out -name "ferium-windows-msvc.zip" -exec sha256sum {} \; | cut -d ' ' -f 1 > ./out/ferium-windows-msvc.zip.sha256 || true

      # HIER IST DER FIX:
      # Wir prüfen: Wurde es manuell gestartet? Dann nimm den Input.
      # Wurde es durch einen Tag-Push gestartet? Dann nimm den Git-Ref.
      - name: Determine Tag Name
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Create release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./out/**/*
          name: Ferium ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: true
          body: |
            Unofficial Build: ${{ env.TAG }}
            
            Based on the original Ferium project.
            Contains binaries for Windows, Linux, and macOS.
