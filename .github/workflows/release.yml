name: Publish and Release

on:
  workflow_dispatch: # Erlaubt manuelles Starten per Klick
  push:
    tags:
      - "v*" # Startet automatisch, wenn du einen Tag wie "v4.7.2-unofficial" pushst

# WICHTIG: Damit der Bot Releases erstellen darf
permissions:
  contents: write

jobs:
  gh-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lädt die Dateien herunter, die im "Build"-Workflow erstellt wurden
      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          # Der Name der Datei muss exakt so heißen wie deine andere Workflow-Datei:
          workflow: build.yml
          workflow_conclusion: success
          # Sucht nach den Artefakten, die wir im Build-Schritt hochgeladen haben
          name: binaries-.*
          name_is_regexp: true
          path: ./out

      - name: Display downloaded files (Debug)
        run: ls -R ./out

      # Erstellt die Checksumme (Optional, aber gut zu haben)
      - name: Create sha256sum for Windows
        # Das "|| true" verhindert Fehler, falls die Windows Datei gerade nicht da ist
        run: |
          find ./out -name "ferium-windows-msvc.zip" -exec sha256sum {} \; | cut -d ' ' -f 1 > ./out/ferium-windows-msvc.zip.sha256 || true

      - name: Get the tag name
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Lädt alles hoch, was im Ordner out/ liegt
          files: ./out/**/*
          name: Ferium ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: true # Markiert es als "Pre-release", da inoffiziell
          body: |
            Unofficial Build: ${{ env.TAG }}
            
            Based on the original Ferium project.
            Contains binaries for Windows, Linux, and macOS.
